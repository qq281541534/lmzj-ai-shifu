# Sample production compose for lmzj-ai-shifu. Copy to the server's
# PROD_DEPLOY_PATH as docker-compose.prod.yml and adjust env/secrets.
#
# Pull-only: images are immutable full-SHA references injected by
# scripts/deploy-images.sh via LMZJ_API_IMAGE / LMZJ_COOK_WEB_IMAGE.
# There is NO `build:` here — the server never builds images.
x-environment: &default-env
  SQLALCHEMY_DATABASE_URI: mysql://root:${MYSQL_ROOT_PASSWORD}@ai-shifu-mysql:3306/ai-shifu?charset=utf8mb4
  REDIS_HOST: ai-shifu-redis
  REDIS_PORT: 6379
  SKIP_LOAD_DOTENV: "1"
  CELERY_BROKER_URL: redis://ai-shifu-redis:6379/0
  CELERY_RESULT_BACKEND: redis://ai-shifu-redis:6379/1

services:
  ai-shifu-api:
    container_name: ai-shifu-api
    image: ${LMZJ_API_IMAGE:?set via deploy-images.sh}
    entrypoint: ["sh", "-c", "until timeout 1 bash -c 'cat < /dev/null > /dev/tcp/ai-shifu-mysql/3306'; do sleep 1; done && flask db upgrade && exec gunicorn -w 4 -b 0.0.0.0:5800 'app:app' --timeout 300 --access-logfile /var/log/app.log --capture-output"]
    env_file:
      - ./.env
    environment: *default-env
    volumes:
      - ./storage:/app/storage
    depends_on:
      - ai-shifu-mysql
      - ai-shifu-redis
    restart: always

  ai-shifu-celery-worker:
    container_name: ai-shifu-celery-worker
    image: ${LMZJ_API_IMAGE:?set via deploy-images.sh}
    entrypoint: ["sh", "-c", "until timeout 1 bash -c 'cat < /dev/null > /dev/tcp/ai-shifu-redis/6379'; do sleep 1; done && exec python -m celery -A celery_app:celery_app worker --loglevel info"]
    env_file:
      - ./.env
    environment: *default-env
    volumes:
      - ./storage:/app/storage
    depends_on:
      - ai-shifu-mysql
      - ai-shifu-redis
    restart: always

  ai-shifu-celery-beat:
    container_name: ai-shifu-celery-beat
    image: ${LMZJ_API_IMAGE:?set via deploy-images.sh}
    entrypoint: ["sh", "-c", "until timeout 1 bash -c 'cat < /dev/null > /dev/tcp/ai-shifu-redis/6379'; do sleep 1; done && exec python -m celery -A celery_app:celery_app beat --loglevel info"]
    env_file:
      - ./.env
    environment: *default-env
    volumes:
      - ./storage:/app/storage
    depends_on:
      - ai-shifu-mysql
      - ai-shifu-redis
    restart: always

  ai-shifu-cook-web:
    container_name: ai-shifu-cook-web
    image: ${LMZJ_COOK_WEB_IMAGE:?set via deploy-images.sh}
    env_file:
      - ./.env
    environment:
      - I18N_ROOT=/app/i18n
    depends_on:
      - ai-shifu-api
    restart: always

  ai-shifu-nginx:
    container_name: ai-shifu-nginx
    image: nginx:stable
    ports:
      - "8080:8080"
    depends_on:
      - ai-shifu-api
      - ai-shifu-cook-web
    restart: always
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf

  ai-shifu-mysql:
    container_name: ai-shifu-mysql
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?required}
      MYSQL_DATABASE: ai-shifu
    volumes:
      - ./mysql_data:/var/lib/mysql
    restart: always

  ai-shifu-redis:
    container_name: ai-shifu-redis
    image: redis:7-alpine
    volumes:
      - ./redis_data:/data
    restart: always
